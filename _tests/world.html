<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World test page</title>
  <script type="importmap">{"imports": {"three": "../assets/vendor/three/three.module.min.js"}}</script>
  <style>html, body { margin: 0; background: #e7e1d4; } #room { position: relative; display: inline-block; --s: 1; } #room > .tim, #room > .emote { position: absolute; left: calc(var(--x) * var(--s) * 1px); top: calc(var(--y) * var(--s) * 1px); }</style>
</head>
<body>
  <div id="room"></div>
  <script type="module">
    // Test page for the 3D world on its own (no game wiring). Exposes window.__world.
    import { createWorld } from '../assets/game/world.js';
    import { frameFor } from '../assets/game/view.js';
    import { lightFor } from '../assets/game/sky.js';
    import { createTim } from '../assets/game/tim.js';
    import { ROOM } from '../assets/game/objects.js';
    try {
      const phone = innerWidth < 640;
      const world = createWorld(document.getElementById('room'), frameFor(innerWidth, innerHeight, 0, phone));
      world.setLight(lightFor({ phase: 'day' }));
      world.setSky('window_day', 0);
      world.renderNow();
      document.getElementById('room').style.setProperty('--s', world.frame.scale);
      window.__world = world;
      window.__tim = createTim(world, document.getElementById('room'), { start: ROOM.start });
    } catch (e) { window.__worldError = String((e && e.stack) || e); }
  </script>
</body>
</html>
